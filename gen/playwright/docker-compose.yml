version: '3.8'

services:
  traffic-generator:
    build: .
    container_name: traffic-generator
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - SECRET_KEY=your-production-secret-key
      - TARGET_URL=https://example.com
      - USE_PROXY=false
      - HEADLESS=true
    volumes:
      - ./logs:/app/logs
      - ./proxies.txt:/app/proxies.txt
      - ./.env:/app/.env
    restart: unless-stopped